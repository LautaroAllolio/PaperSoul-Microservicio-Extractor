[project]
name = "pdfextractor"
version = "0.1.0"
description = "pdfextractor — PDF→JSON extraction microservice (FastAPI, zero-disk, constant-memory streaming)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pymupdf>=1.27",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfextractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pdfextractor"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true