# Compose del Extractor. Define ÚNICAMENTE los recursos propios del Extractor:
# no incluye Traefik ni Consul (que descubre las réplicas por el provider
# Consul Catalog de Traefik) ni los demás servicios de PaperSoul, que se
# despliegan por separado y se alcanzan a través de la red externa `mired`.
#
# No publica el puerto 9000 al host (lo expone Traefik dentro de `mired`) y no
# fija `container_name`, así que se pueden levantar varias réplicas.
#
# El routing ya NO vive en labels Docker: cada réplica se registra ante el
# agente Consul (PDFEXTRACTOR_CONSUL_HTTP_ADDR) con tags `traefik.*` idénticas
# entre réplicas — un único router y un único servicio (compartidos) con
# balanceo y healthcheck. Ver `src/pdfextractor/infrastructure/discovery/consul.py`.
name: papersoul-extractor

services:
  extractor:
    # La imagen no se construye acá: EXTRACTOR_IMAGE es obligatoria y debe
    # apuntar a una versión concreta (ver README §Despliegue con Docker Compose).
    image: ${EXTRACTOR_IMAGE:?Definí EXTRACTOR_IMAGE con una versión concreta (p. ej. pdfextractor:v1.0.0)}
    restart: unless-stopped
    environment:
      # Escucha en todas las interfaces del contenedor: Traefik llega por la red
      # `mired` (no se publica nada al host).
      PDFEXTRACTOR_HOST: ${PDFEXTRACTOR_HOST:-0.0.0.0}
      PDFEXTRACTOR_PORT: ${PDFEXTRACTOR_PORT:-9000}
      # 0: el orquestador acepta texto vacío (PDF escaneado).
      PDFEXTRACTOR_MIN_TEXT_LENGTH: ${PDFEXTRACTOR_MIN_TEXT_LENGTH:-0}
      # Pool pequeño por réplica: las réplicas comparten host, y lo que hay que
      # proteger es el event loop de cada una (no el pool). Ver README §Escalado.
      PDFEXTRACTOR_WORKERS: ${EXTRACTOR_WORKERS:-2}
      PDFEXTRACTOR_MAX_CONCURRENT_EXTRACTIONS: ${EXTRACTOR_MAX_CONCURRENT:-2}
      # Puerta del event loop (TASK-37): peticiones admitidas a la vez. Por
      # defecto acompaña a MAX_CONCURRENT_EXTRACTIONS; el exceso se rechaza con
      # 503 {"error":"overloaded"} sin leer el cuerpo.
      PDFEXTRACTOR_MAX_INFLIGHT_REQUESTS: ${EXTRACTOR_MAX_INFLIGHT:-${EXTRACTOR_MAX_CONCURRENT:-2}}
      PDFEXTRACTOR_QUEUE_TIMEOUT_SECONDS: ${PDFEXTRACTOR_QUEUE_TIMEOUT_SECONDS:-5.0}
      PDFEXTRACTOR_WARMUP: ${PDFEXTRACTOR_WARMUP:-true}
      PDFEXTRACTOR_METRICS_ENABLED: ${PDFEXTRACTOR_METRICS_ENABLED:-true}
      PDFEXTRACTOR_LOG_LEVEL: ${PDFEXTRACTOR_LOG_LEVEL:-INFO}
      # --- Registro en Consul (tareas 7 y 8 del plan de integración) ---------
      # Habilita el registro de la réplica ante el agente Consul (API HTTP en
      # `mired`). Con enabled=false la réplica arranca igual y no registra:
      # sirve para dev local sin Docker e integración por etapas.
      PDFEXTRACTOR_CONSUL_ENABLED: ${PDFEXTRACTOR_CONSUL_ENABLED:-true}
      PDFEXTRACTOR_CONSUL_HTTP_ADDR: ${PDFEXTRACTOR_CONSUL_HTTP_ADDR:-http://consul:8500}
      # Identidad anunciada: el nombre debe coincidir con el que busca el
      # Orquestador (`extractor`). Puerto vacío = PDFEXTRACTOR_PORT; ID vacío =
      # nombre + hostname + puerto.
      PDFEXTRACTOR_CONSUL_SERVICE_NAME: ${PDFEXTRACTOR_CONSUL_SERVICE_NAME:-extractor}
      PDFEXTRACTOR_CONSUL_SERVICE_PORT: ${PDFEXTRACTOR_CONSUL_SERVICE_PORT:-}
      PDFEXTRACTOR_CONSUL_SERVICE_ID: ${PDFEXTRACTOR_CONSUL_SERVICE_ID:-}
      # IP que la réplica anuncia en `mired`. Vacía = autodetección de la
      # primera IPv4 no loopback; fijarla solo si el contenedor tiene varias
      # redes.
      PDFEXTRACTOR_CONSUL_ADVERTISE_ADDR: ${PDFEXTRACTOR_CONSUL_ADVERTISE_ADDR:-}
      # Tags traefik.* del registro: entrypoint y TLS del router (el Compose
      # las pasa a la app; ya no interpolan labels del contenedor).
      EXTRACTOR_ENTRYPOINT: ${EXTRACTOR_ENTRYPOINT:-https}
      EXTRACTOR_TLS: ${EXTRACTOR_TLS:-true}
    # Margen para que terminen las extracciones en vuelo (el timeout de
    # extracción es 30 s) y el desregistro ordenado ante Consul entre en la
    # ventana, antes de que el contenedor muera.
    stop_grace_period: ${EXTRACTOR_STOP_GRACE_PERIOD:-35s}
    deploy:
      replicas: ${EXTRACTOR_REPLICAS:-3}
    networks:
      - mired
    # Healthcheck de Docker, independiente de Traefik y Consul. El `start_period`
    # cubre el calentamiento del pool de extracción: hasta ~8 s con el host
    # saturado, el contenedor no responde y quedaría en "starting".
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sin `ports:` (no se publica al host), sin `container_name` (permite
    # escalar) y sin labels `traefik.*`: el routing pasa por las tags del
    # registro Consul (Consul Catalog provider), no por el Docker provider.

networks:
  # Red del stack de Traefik: administrada fuera de este Compose. No se crea ni
  # se elimina aquí; debe existir antes de `docker compose up`.
  mired:
    external: true
    name: ${TRAEFIK_NETWORK:-mired}
