name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_contract_tests:
        description: "Run contract tests against real downstream"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --extra extractor

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        run: uv run mypy -p paperextractor && uv run mypy -p pdfextractor

      - name: Test (unit + integration, no contract)
        run: uv run pytest -q

      - name: Contract tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_contract_tests }}
        env:
          EXTRACTOR_BASE_URL: ${{ secrets.EXTRACTOR_BASE_URL }}
        run: uv run pytest -m contract -q
